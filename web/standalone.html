<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0b0b1e" />
<title>Geometry Dash Recreation</title>
<style>:root {
  --bg: #0b0b1e;
  --panel: rgba(15, 17, 40, 0.92);
  --accent: #7fd8ff;
  --accent2: #4db8ff;
  --text: #eaf6ff;
  --muted: #8aa0b8;
  --danger: #ff5b6e;
  --success: #5bffa0;
}

* {
  box-sizing: border-box;
}

#game {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
}

.ui-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  color: var(--text);
}

.ui-layer > * {
  pointer-events: auto;
}

.screen {
  pointer-events: auto;
}

.hud,
.hud .progress-track,
.notice,
.toast,
.debug-overlay,
.overlay {
  pointer-events: none;
}

.hud .btn {
  pointer-events: auto;
}

.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  background: radial-gradient(120% 120% at 50% 20%, rgba(30, 36, 90, 0.55), rgba(5, 5, 15, 0.9));
  transition: opacity 0.18s ease;
}

.screen.hidden {
  display: none;
}

.logo {
  font-size: 64px;
  font-weight: 900;
  letter-spacing: 3px;
  background: linear-gradient(180deg, #9fe8ff, #4db8ff 60%, #2f6bff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 0 30px rgba(77, 184, 255, 0.35);
  user-select: none;
}

.subtitle {
  color: var(--muted);
  letter-spacing: 6px;
  font-size: 13px;
  text-transform: uppercase;
  margin-top: -12px;
}

.menu-col {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
  min-width: 280px;
}

.btn {
  pointer-events: auto;
  cursor: pointer;
  border: 2px solid var(--accent);
  background: rgba(20, 28, 70, 0.6);
  color: var(--text);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 1px;
  padding: 12px 34px;
  border-radius: 10px;
  min-width: 240px;
  text-align: center;
  transition: transform 0.08s ease, background 0.12s ease, box-shadow 0.12s ease;
  box-shadow: 0 0 0 rgba(77, 184, 255, 0);
  user-select: none;
}

.btn:hover {
  background: rgba(40, 60, 130, 0.85);
  box-shadow: 0 0 18px rgba(77, 184, 255, 0.4);
}

.btn:active {
  transform: scale(0.96);
  background: rgba(77, 184, 255, 0.35);
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  box-shadow: none;
  transform: none;
}

.btn.small {
  min-width: 0;
  padding: 8px 16px;
  font-size: 13px;
}

.btn.primary {
  border-color: var(--success);
  color: var(--success);
}

.btn.danger {
  border-color: var(--danger);
  color: var(--danger);
}

.panel {
  background: var(--panel);
  border: 1px solid rgba(127, 216, 255, 0.2);
  border-radius: 16px;
  padding: 26px 30px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 300px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}

.panel h2 {
  margin: 0;
  font-size: 22px;
  letter-spacing: 1px;
  color: var(--accent);
  text-align: center;
}

.panel .row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.panel label {
  color: var(--muted);
  font-size: 14px;
}

input[type='text'],
input[type='password'],
input[type='number'],
select {
  background: rgba(10, 12, 30, 0.9);
  border: 1px solid rgba(127, 216, 255, 0.3);
  color: var(--text);
  border-radius: 8px;
  padding: 9px 12px;
  font-size: 14px;
  width: 100%;
}

input:focus,
select:focus {
  outline: none;
  border-color: var(--accent);
}

input[type='range'] {
  width: 140px;
}

.hud {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  padding: 12px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.progress-track {
  flex: 1;
  height: 14px;
  background: rgba(10, 12, 30, 0.75);
  border-radius: 7px;
  border: 1px solid rgba(127, 216, 255, 0.35);
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #4db8ff, #9fe8ff);
  border-radius: 7px;
  transition: width 0.1s linear;
}

.hud .pct {
  font-weight: 800;
  font-size: 18px;
  min-width: 52px;
  text-align: right;
  color: var(--accent);
}

.hud .attempts {
  color: var(--muted);
  font-size: 12px;
}

.top-right {
  position: absolute;
  top: 12px;
  right: 16px;
  display: flex;
  gap: 10px;
  align-items: center;
}

.notice {
  position: absolute;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(15, 17, 40, 0.9);
  border: 1px solid rgba(127, 216, 255, 0.4);
  padding: 8px 20px;
  border-radius: 20px;
  font-size: 14px;
  letter-spacing: 1px;
}

.dead-text {
  color: var(--danger);
  font-weight: 900;
  font-size: 40px;
  letter-spacing: 4px;
}

.complete-text {
  color: var(--success);
  font-weight: 900;
  font-size: 40px;
  letter-spacing: 4px;
}

.slider-label {
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: space-between;
}

.toast {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(15, 17, 40, 0.95);
  border: 1px solid rgba(127, 216, 255, 0.4);
  padding: 10px 22px;
  border-radius: 12px;
  font-size: 14px;
  letter-spacing: 1px;
  transition: opacity 0.3s ease;
}

.debug-overlay {
  position: absolute;
  top: 8px;
  left: 8px;
  font-family: monospace;
  font-size: 11px;
  color: #9fe8ff;
  background: rgba(0, 0, 0, 0.55);
  padding: 8px 10px;
  border-radius: 6px;
  white-space: pre;
  line-height: 1.5;
  pointer-events: none;
}

.editor-bar {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 10px;
  background: rgba(8, 10, 26, 0.9);
  border-top: 1px solid rgba(127, 216, 255, 0.25);
  align-items: center;
}

.editor-bar .btn {
  min-width: 0;
  padding: 6px 12px;
  font-size: 12px;
}

.palette {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}

.palette .swatch {
  width: 34px;
  height: 34px;
  border-radius: 6px;
  border: 2px solid transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: #fff;
  text-shadow: 0 0 4px #000;
}

.palette .swatch.active {
  border-color: var(--accent);
  box-shadow: 0 0 12px rgba(77, 184, 255, 0.7);
}

.ui-layer > .editor-screen { pointer-events: none; }
.editor-bar, .overlay button { pointer-events: auto; }
.editor-bar { max-height: 43vh; overflow-y: auto; }
.editor-bar input, .editor-bar select { background: #122438; color: #edfaff; padding: 6px; border: 1px solid #477387; border-radius: 4px; }
.editor-properties { display: flex; flex-wrap: wrap; gap: 5px; }
.editor-properties label { display: grid; font-size: .78rem; }
.editor-properties input { width: 5em; }
.icon-preview { padding: 20px; border: 3px solid #70deff; color: #aeefff; }
.icon-preview::before { content: ''; display: inline-block; height: 20px; width: 20px; background: #53dfff; margin-right: 14px; vertical-align: middle; }
.icon-preview[data-icon="1"]::before { transform: rotate(45deg); }
.icon-preview[data-icon="2"]::before { border-radius: 100%; }
.logo { font-size: clamp(32px,7vw,72px); text-align: center; }
#level-list { max-height: 60vh; overflow: auto; }
#game { touch-action: none; }
</style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
  <div id="loading-text">LOADING...</div>
</div>
<canvas id="game"></canvas>
