<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Geometry Web — a Cocos2d-HTML5 platformer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        #gameContainer { position: relative; width: 100%; height: 100%; }
        canvas { display: block; }
        /* Prevent text/image selection and tap highlight */
        body, canvas, div { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="960" height="540"></canvas>
    </div>
    <script src="cocos2d.js"></script>
</body>
</html>
