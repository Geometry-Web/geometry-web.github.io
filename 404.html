<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>404 — level not found | Geometry Web</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="robots" content="noindex"/>
    <link rel="icon" type="image/x-icon" href="/res/favicon.ico"/>
    <style>
        html, body {

            height: 100%;
            background: #000;

        p { margin: 0.4em 0; opacity: 0.85; }
        img { width: 96px; height: 96px; image-rendering: pixelated; margin-bottom: 1em; }

            margin-top: 1.6em;
            display: inline-block;
            padding: 0.7em 1.8em;
            border: 2px solid #7cf05f;

            color: #7cf05f;

            letter-spacing: 0.08em;
        }
        a.btn:hover { background: #7cf05f; color: #000; }

<div class="wrap">
    <img src="/GeometryWebicon.png" alt="Geometry Web icon"/>
